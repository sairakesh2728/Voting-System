<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4 font-sans">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md relative">
        <a href="index.html" class="absolute top-8 left-8 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="fas fa-arrow-left text-2xl"></i>
        </a>

        <div class="mt-10 text-center">
            <h2 class="text-4xl font-extrabold text-gray-800">Create Account</h2>
            <p class="text-gray-500 mt-2 mb-10">Join thousands of voters today</p>
        </div>

        <form id="signupForm" class="space-y-6">
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="name" required
                    class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] focus:border-transparent outline-none transition-all"
                    placeholder="Full Name">
            </div>

            <div class="relative">
                <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" id="email" required
                    class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] focus:border-transparent outline-none transition-all"
                    placeholder="Email Address">
            </div>

            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="password" required
                    class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] focus:border-transparent outline-none transition-all"
                    placeholder="Create Password">
            </div>

            <button type="submit" id="signupBtn"
                class="w-full py-4 bg-[#2C5364] text-white rounded-2xl font-bold shadow-lg hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                <span>REGISTER</span>
                <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
            </button>
        </form>

        <p class="mt-10 text-center text-gray-600">
            Already have an account?
            <a href="login.html" class="text-[#2C5364] font-bold hover:underline transition-all">Sign In</a>
        </p>
    </div>

    <script src="api.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signupBtn');
            const loader = document.getElementById('loader');

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.signup(name, email, password);
                if (response.id || response.email) {
                    localStorage.setItem('temp_userEmail', email);
                    localStorage.setItem('temp_password', password); // Temporary to login after OTP

                    const otpResp = await api.sendOtp(email);
                    window.location.href = `otp-verify.html?email=${encodeURIComponent(email)}&flow=SIGNUP`;
                } else {
                    alert('Signup failed: ' + (response.detail || 'Unknown error'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
