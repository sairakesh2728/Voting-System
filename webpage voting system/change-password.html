<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen">
    <header class="bg-white px-6 py-6 flex items-center shadow-sm">
        <a href="security-privacy.html" class="text-gray-400 hover:text-gray-600 mr-4">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-xl font-extrabold text-gray-800">Change Password</h1>
    </header>

    <main class="px-6 mt-10 max-w-md mx-auto">
        <!-- Step 1: Passwords -->
        <div id="step1" class="space-y-6">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-50 text-[#2C5364] rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i class="fas fa-lock text-3xl"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800">New Credentials</h2>
                <p class="text-gray-500 text-sm mt-1">Please enter your current and new password</p>
            </div>

            <form id="passwordForm" class="space-y-5">
                <div class="space-y-4">
                    <div class="relative">
                        <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="oldPassword" required
                            class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                            placeholder="Current Password">
                    </div>
                    <div class="relative">
                        <i class="fas fa-shield absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="newPassword" required
                            class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                            placeholder="New Password">
                    </div>
                    <div class="relative">
                        <i class="fas fa-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="confirmPassword" required
                            class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                            placeholder="Confirm New Password">
                    </div>
                </div>

                <button type="submit" id="initiateBtn"
                    class="w-full py-4 bg-[#2C5364] text-white rounded-2xl font-bold shadow-lg hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                    <span>SEND VERIFICATION OTP</span>
                    <div id="loader1" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
                </button>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step2" class="hidden space-y-6">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i class="fas fa-paper-plane text-3xl"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800">Verify Identity</h2>
                <p class="text-gray-500 text-sm mt-1">We've sent a code to your registered email</p>
            </div>

            <form id="otpForm" class="space-y-8">
                <div class="flex justify-center">
                    <input type="text" maxlength="6" id="otp"
                        class="w-full text-center text-4xl font-bold tracking-[0.5em] py-5 bg-white border border-gray-200 rounded-3xl shadow-sm focus:ring-4 focus:ring-[#2C5364]/10 focus:border-[#2C5364] outline-none transition-all"
                        placeholder="000000">
                </div>

                <button type="submit" id="finalizeBtn"
                    class="w-full py-4 bg-[#2C5364] text-white rounded-2xl font-bold shadow-lg hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                    <span>FINALIZE UPDATE</span>
                    <div id="loader2" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
                </button>
            </form>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        const token = checkAuth();
        let cachedNewPassword = "";

        // Step 1: Initiate
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) return alert('New passwords do not match');
            if (newPass.length < 6) return alert('Password must be at least 6 characters');

            const btn = document.getElementById('initiateBtn');
            const loader = document.getElementById('loader1');

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.initiatePasswordChange(oldPass, newPass, token);
                if (response.success) {
                    cachedNewPassword = newPass;
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else {
                    alert('Error: ' + (response.detail || response.message || 'Incorrect old password'));
                }
            } catch (err) {
                alert('Network Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });

        // Step 2: Finalize
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const email = localStorage.getItem('userEmail');

            if (otp.length !== 6) return alert('Please enter 6-digit OTP');

            const btn = document.getElementById('finalizeBtn');
            const loader = document.getElementById('loader2');

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.finalizePasswordChange(email, otp, cachedNewPassword);
                if (response.success) {
                    alert('Password changed successfully! Please log in again.');
                    logout();
                } else {
                    alert('Verification failed: ' + (response.detail || response.message));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
