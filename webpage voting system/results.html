<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-10">
    <header class="bg-white px-6 py-8 flex items-center shadow-sm sticky top-0 z-20">
        <a href="home.html" class="text-gray-400 hover:text-gray-600 mr-4">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-2xl font-black text-gray-800 tracking-tight">Election Results</h1>
    </header>

    <main class="px-6 mt-8 max-w-lg mx-auto">
        <div id="resultsCard" class="bg-white p-8 rounded-[3rem] shadow-sm border border-gray-100 mb-8 overflow-hidden relative">
            <div class="absolute top-0 right-0 p-8 opacity-5">
                <i class="fas fa-trophy text-[8rem] rotate-12"></i>
            </div>

            <div class="relative z-10">
                <h2 id="electionName" class="text-2xl font-black text-gray-800 mb-2">Loading...</h2>
                <div class="flex items-center space-x-2 text-xs font-bold text-gray-400 uppercase tracking-widest mb-8">
                    <span id="totalVotes">0</span> Total Votes Cast
                </div>

                <div id="resultsList" class="space-y-6">
                    <!-- Loading state -->
                    <div class="animate-pulse flex items-center justify-between">
                        <div class="h-4 w-32 bg-gray-100 rounded"></div>
                        <div class="h-4 w-12 bg-gray-100 rounded"></div>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="location.reload()" class="w-full py-4 bg-gray-100 text-[#2C5364] rounded-2xl font-extrabold flex items-center justify-center space-x-2 hover:bg-gray-200 transition-colors">
            <i class="fas fa-sync-alt"></i>
            <span>REFRESH DATA</span>
        </button>
    </main>

    <script src="api.js"></script>
    <script>
        const token = checkAuth();
        const urlParams = new URLSearchParams(window.location.search);
        const electionId = urlParams.get('id');

        async function loadResults() {
            try {
                // Get election name first
                const my = await api.getMyElections(token);
                const joined = await api.getJoinedElections(token);
                const all = [...my, ...joined];
                const el = all.find(e => e.id === electionId);
                if (el) document.getElementById('electionName').innerText = el.name;

                // Get actual results
                const results = await api.getResults(electionId);
                const container = document.getElementById('resultsList');
                container.innerHTML = '';

                let total = 0;
                results.forEach(r => total += r.votes);
                document.getElementById('totalVotes').innerText = total;

                if (results.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-400 py-4">No votes cast yet</p>';
                    return;
                }

                results.sort((a, b) => b.votes - a.votes).forEach((r, idx) => {
                    const percentage = total > 0 ? (r.votes / total * 100).toFixed(1) : 0;
                    const isWinner = idx === 0 && r.votes > 0;

                    const symbolHtml = r.symbol_url ? `<img src="${r.symbol_url}" class="w-8 h-8 object-contain mr-3" onerror="this.style.display='none'">` : '';

                    const div = document.createElement('div');
                    div.className = "space-y-2";
                    div.innerHTML = `
                        <div class="flex justify-between items-end">
                            <div class="flex items-center">
                                ${symbolHtml}
                                <div>
                                    <h3 class="font-bold text-gray-800 flex items-center">
                                        ${r.candidate}
                                        ${isWinner ? '<i class="fas fa-crown text-amber-400 text-xs ml-2"></i>' : ''}
                                    </h3>
                                    <p class="text-[10px] font-bold text-gray-400 uppercase">${percentage}% of total</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="font-black text-[#2C5364]">${r.votes}</span>
                                <span class="text-[10px] font-bold text-gray-400 ml-1">VOTES</span>
                            </div>
                        </div>
                        <div class="w-full h-3 bg-gray-50 rounded-full overflow-hidden border border-gray-100">
                            <div class="h-full bg-[#2C5364] transition-all duration-1000 ease-out rounded-full" style="width: ${percentage}%"></div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }
        loadResults();
    </script>
</body>
</html>
