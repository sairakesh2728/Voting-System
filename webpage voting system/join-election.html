<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Election - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen">
    <header class="bg-white px-6 py-6 flex items-center shadow-sm">
        <a href="home.html" class="text-gray-400 hover:text-gray-600 mr-4">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-xl font-extrabold text-gray-800">Join Election</h1>
    </header>

    <main class="px-6 mt-12 max-w-md mx-auto">
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-amber-50 text-amber-500 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-inner">
                <i class="fas fa-key text-4xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-800">Enter Election Code</h2>
            <p class="text-gray-500 mt-2">Get the 6-character unique code from the election organizer</p>
        </div>

        <form id="joinForm" class="space-y-6">
            <div>
                <input type="text" id="code" required maxlength="6"
                    class="w-full text-center text-3xl font-bold tracking-[0.5em] py-5 bg-white border border-gray-200 rounded-[2rem] shadow-sm focus:ring-4 focus:ring-[#2C5364]/10 focus:border-[#2C5364] outline-none transition-all uppercase"
                    placeholder="XXXXXX">
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100 space-y-4">
                <h3 class="font-bold text-gray-400 uppercase text-xs tracking-widest text-center">Your Details</h3>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="fullName" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                        placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Voter ID / ID Number</label>
                    <input type="text" id="idNumber" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                        placeholder="VTR-123456">
                </div>
            </div>

            <button type="submit" id="joinBtn"
                class="w-full py-5 bg-[#2C5364] text-white rounded-[2rem] font-bold shadow-xl shadow-[#2C5364]/20 hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                <span>JOIN ELECTION</span>
                <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
            </button>
        </form>
    </main>

    <script src="api.js"></script>
    <script>
        const token = checkAuth();

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('joinBtn');
            const loader = document.getElementById('loader');

            const data = {
                election_code: document.getElementById('code').value.toUpperCase(),
                full_name: document.getElementById('fullName').value,
                id_number: document.getElementById('idNumber').value
            };

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.joinElection(data, token);
                if (response.id || response.election_code) {
                    alert('Application Submitted! Please wait for admin approval.');
                    window.location.href = 'home.html';
                } else {
                    alert('Error: ' + (response.detail || 'Could not join'));
                }
            } catch (err) {
                alert('Network Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
