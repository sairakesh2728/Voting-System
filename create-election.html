<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Election - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans pb-10">
    <header class="bg-white px-6 py-6 flex items-center shadow-sm">
        <a href="home.html" class="text-gray-400 hover:text-gray-600 mr-4">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-xl font-extrabold text-gray-800">New Election</h1>
    </header>

    <main class="px-6 mt-8 max-w-lg mx-auto">
        <form id="createForm" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                <h2 class="font-bold text-gray-400 uppercase text-xs tracking-widest mb-2">Basic Info</h2>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Election Title</label>
                    <input type="text" id="title" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                        placeholder="e.g. Student Council 2026">
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Date</label>
                        <input type="date" id="date" required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all">
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-400 uppercase text-xs tracking-widest">Candidates</h2>
                    <button type="button" onclick="addCandidate()" class="text-[#2C5364] text-xs font-bold flex items-center">
                        <i class="fas fa-plus-circle mr-1"></i> ADD MORE
                    </button>
                </div>

                <div id="candidatesList" class="space-y-4">
                    <!-- Candidates will be added here -->
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-4 bg-[#2C5364] text-white rounded-2xl font-bold shadow-lg hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                <span>CREATE ELECTION</span>
                <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
            </button>
        </form>
    </main>

    <script src="api.js"></script>
    <script>
        const token = checkAuth();

        function addCandidate() {
            const list = document.getElementById('candidatesList');
            const count = list.children.length + 1;
            const div = document.createElement('div');
            div.className = "candidate-item p-4 bg-gray-50 rounded-2xl border border-gray-100 relative space-y-3";

            // First two candidates shouldn't be removable for basic integrity
            const removeBtn = count > 2 ? `
                <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-400 hover:text-red-600 transition-colors">
                    <i class="fas fa-times-circle"></i>
                </button>` : '';

            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Candidate ${count}</span>
                    ${removeBtn}
                </div>
                <input type="text" name="candidate" required
                    class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                    placeholder="Full Name">
                <div class="flex flex-col space-y-2">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Party Symbol</label>
                    <div class="flex items-center space-x-3">
                        <input type="file" name="symbol_file" accept="image/*" required
                            class="flex-grow text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-[#2C5364] hover:file:bg-blue-100">
                        <input type="hidden" name="symbol_base64">
                        <div class="preview-box w-10 h-10 bg-white border border-gray-200 rounded-xl flex items-center justify-center text-gray-300 overflow-hidden">
                            <i class="fas fa-image"></i>
                        </div>
                    </div>
                </div>
            `;

            const fileInput = div.querySelector('input[name="symbol_file"]');
            const base64Input = div.querySelector('input[name="symbol_base64explicit"]'); // Using a different name to find easily

            // Fix: Actually the original script used getElementsByName('symbol_base64')
            // Let's ensure consistency
            const hiddenInput = div.querySelector('input[name="symbol_base64"]');
            const preview = div.querySelector('.preview-box');

            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onloadend = () => {
                    hiddenInput.value = reader.result;
                    preview.innerHTML = `<img src="${reader.result}" class="w-full h-full object-contain">`;
                };
                reader.readAsDataURL(file);
            };

            list.appendChild(div);
        }

        // Initialize with 2 candidates
        addCandidate();
        addCandidate();

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');

            const candidateNames = document.getElementsByName('candidate');
            const symbolBase64s = document.getElementsByName('symbol_base64');

            const candidates = [];
            for(let i=0; i < candidateNames.length; i++) {
                const name = candidateNames[i].value.trim();
                const symbol = symbolBase64s[i].value;

                if (!name) return alert(`Please enter name for Candidate ${i+1}`);
                if (!symbol) return alert(`Please upload a symbol for ${name || 'Candidate ' + (i+1)}`);

                candidates.push({
                    name: name,
                    symbol_url: symbol
                });
            }

            if (candidates.length < 2) return alert('At least 2 candidates required');

            const data = {
                name: document.getElementById('title').value,
                date: document.getElementById('date').value,
                candidates: candidates
            };

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.createElection(data, token);
                if (response.id || response.election_code) {
                    alert('Election Created! Code: ' + response.election_code);
                    window.location.href = `election-success.html?code=${response.election_code}`;
                } else {
                    alert('Failed: ' + (response.detail || 'Error from server'));
                }
            } catch (err) {
                console.error(err);
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
