<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security & Privacy - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen">
    <!-- Header -->
    <header class="bg-white px-6 py-8 flex items-center shadow-sm sticky top-0 z-20">
        <a href="profile.html" class="text-gray-400 hover:text-gray-600 mr-4">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-2xl font-black text-gray-800 tracking-tight">Security & Privacy</h1>
    </header>

    <main class="px-6 mt-8 max-w-lg mx-auto">
        <div class="space-y-4">
            <h3 class="font-bold text-gray-400 uppercase text-[10px] tracking-[0.2em] ml-4 mb-2">Login Security</h3>

            <button onclick="window.location.href='change-password.html'" class="w-full bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 flex items-center justify-between hover:bg-gray-50 transition-all group">
                <div class="flex items-center space-x-5">
                    <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-[1.5rem] flex items-center justify-center group-hover:rotate-12 transition-transform">
                        <i class="fas fa-key text-xl"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-bold text-gray-800 text-lg">Change Password</h3>
                        <p class="text-xs text-gray-400 font-medium">Update your account password</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 group-hover:text-[#2C5364] transition-colors"></i>
            </button>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        checkAuth();
    </script>
</body>
</html>
