<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4 font-sans">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <div class="mb-8">
            <div class="w-20 h-20 bg-blue-50 text-[#2C5364] rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-shield-check text-4xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800">Verification</h2>
            <p class="text-gray-500 mt-2">Enter the 6-digit code sent to your email</p>
            <p id="displayEmail" class="font-bold text-[#2C5364] mt-1"></p>
        </div>

        <form id="otpForm" class="space-y-8">
            <div class="flex justify-center space-x-2">
                <input type="text" maxlength="6" id="otp"
                    class="w-full text-center text-4xl font-bold tracking-[0.5em] py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all"
                    placeholder="000000">
            </div>

            <button type="submit" id="verifyBtn"
                class="w-full py-4 bg-[#2C5364] text-white rounded-2xl font-bold shadow-lg hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                <span>VERIFY & PROCEED</span>
                <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
            </button>
        </form>

        <button id="resendBtn" class="mt-8 text-gray-500 hover:text-[#2C5364] font-medium transition-colors">
            Didn't receive the code? <span class="font-bold underline">Resend</span>
        </button>
    </div>

    <script src="api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const flow = urlParams.get('flow');
        document.getElementById('displayEmail').innerText = email;

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const btn = document.getElementById('verifyBtn');
            const loader = document.getElementById('loader');

            if (otp.length !== 6) return alert('Please enter 6-digit OTP');

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.verifyOtp(email, otp);
                if (response.message === "Verified") {
                    if (flow === 'SIGNUP') {
                        // Login automatically after signup verification
                        const password = localStorage.getItem('temp_password');
                        const loginResp = await api.login(email, password);
                        localStorage.setItem('authToken', `${loginResp.token_type} ${loginResp.access_token}`);
                        localStorage.setItem('userEmail', email);
                        localStorage.setItem('userName', loginResp.user.name);
                    } else {
                        // Move temp to main
                        localStorage.setItem('authToken', localStorage.getItem('temp_token'));
                        localStorage.setItem('userEmail', localStorage.getItem('temp_userEmail'));
                        localStorage.setItem('userName', localStorage.getItem('temp_userName'));
                    }

                    // Cleanup
                    localStorage.removeItem('temp_token');
                    localStorage.removeItem('temp_userEmail');
                    localStorage.removeItem('temp_userName');
                    localStorage.removeItem('temp_password');

                    window.location.href = 'home.html';
                } else {
                    alert('Verification failed: ' + (response.detail || 'Invalid OTP'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async () => {
            try {
                await api.sendOtp(email);
                alert('OTP resent to your email');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
