<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Cast - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-6 font-sans">
    <div class="bg-white p-12 rounded-[3.5rem] shadow-2xl w-full max-w-md text-center relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-blue-50 rounded-full opacity-50"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-blue-50 rounded-full opacity-50"></div>

        <div class="relative z-10">
            <div class="w-28 h-28 bg-[#2C5364] text-white rounded-[2.5rem] flex items-center justify-center mx-auto mb-10 shadow-2xl shadow-[#2C5364]/40">
                <i class="fas fa-paper-plane text-4xl"></i>
            </div>

            <h2 class="text-3xl font-black text-gray-800 tracking-tight">Vote Cast!</h2>
            <p class="text-gray-500 mt-4 leading-relaxed">
                Thank you for participating in <br>
                <span id="electionName" class="font-black text-[#2C5364]">Election</span>
            </p>

            <div class="mt-12 space-y-4">
                <button onclick="window.location.href='home.html'"
                    class="w-full py-5 bg-[#2C5364] text-white rounded-[2rem] font-bold shadow-xl hover:bg-[#244452] transition-all transform active:scale-95">
                    BACK TO HOME
                </button>
            </div>

            <p class="mt-10 text-[10px] text-gray-400 font-bold uppercase tracking-widest">Digital Receipt Generated</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('electionName').innerText = urlParams.get('election') || 'the election';
    </script>
</body>
</html>
