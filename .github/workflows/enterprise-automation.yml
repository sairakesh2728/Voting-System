name: Enterprise E2E Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./webpage voting system"
          publish_branch: gh-pages

  android-e2e:
    needs: build-and-deploy-web
    runs-on: macos-latest # Required for Android Emulator hardware acceleration
    steps:
      - uses: actions/checkout@v3

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        working-directory: ./VotingSystem
        run: ./gradlew assembleDebug

      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: |
            npm install -g appium
            appium & 
            cd automation/android-appium
            mvn test

      - name: Upload Android Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-automation-reports
          path: automation/android-appium/reports/

  web-e2e:
    needs: build-and-deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Selenium Dependencies
        working-directory: ./automation/web-selenium
        run: npm install

      - name: Run Selenium Tests
        working-directory: ./automation/web-selenium
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm test

      - name: Generate Selenium Reports
        if: always()
        working-directory: ./automation/web-selenium
        run: npm run report

      - name: Upload Web Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: web-automation-reports
          path: automation/web-selenium/reports/

  publish-combined-reports:
    needs: [android-e2e, web-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: all-reports

      - name: Prepare Reports for Hosting
        run: |
          mkdir -p final-reports/latest
          cp -r all-reports/web-automation-reports/* final-reports/latest/
          cp -r all-reports/android-automation-reports/* final-reports/latest/

      - name: Deploy Reports to GitHub Pages (Subdirectory)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final-reports
          destination_dir: reports
          keep_files: true
