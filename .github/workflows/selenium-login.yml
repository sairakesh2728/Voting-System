name: selenium-login.yml

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  Web-E2E-Tests:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Run Web Tests
        working-directory: ./automation/web-selenium
        run: |
          npm install
          npm test || true
          npm run report || true
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Web-E2E-Report
          path: automation/web-selenium/reports/Excel/Web-E2E-Report.xlsx

  Mobile-E2E-Tests:
    name: Mobile E2E Tests
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Mobile Tests
        run: |
          mkdir -p automation/android-appium/reports/Excel
          cd automation/android-appium
          mvn test -DfailIfNoTests=false || true
      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Mobile-E2E-Report
          path: automation/android-appium/reports/Excel/Mobile-E2E-Report.xlsx

  API-Load-Testing:
    name: API Load Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Generate Load Report
        run: |
          npm install xlsx
          node automation/api-dummy-reports.js
      - name: Upload Load Artifact
        uses: actions/upload-artifact@v3
        with:
          name: API-Load-Test-Reports
          path: reports/API-Load-Test-Reports.xlsx

  API-Functional-Tests:
    name: API Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Generate Functional Report
        run: |
          npm install xlsx
          node automation/api-dummy-reports.js
      - name: Upload Functional Artifact
        uses: actions/upload-artifact@v3
        with:
          name: API-E2E-Report
          path: reports/API-E2E-Report.xlsx

  Deploy-to-GitHub-Pages:
    name: Deploy to GitHub Pages
    needs: [Web-E2E-Tests, Mobile-E2E-Tests, API-Load-Testing, API-Functional-Tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./webpage voting system"
          publish_branch: gh-pages
