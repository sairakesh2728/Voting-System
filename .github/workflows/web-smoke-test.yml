name: web-smoke-test.yml

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  Web-Smoke-Execution:
    name: Web Smoke Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Run Web Smoke Suite
        run: |
          echo "Executing Web Smoke Test Suite..."
          npm install xlsx --no-save

  Generate-Smoke-Report:
    name: Generate Smoke Report
    needs: Web-Smoke-Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Create Excel Smoke Report
        run: |
          npm install xlsx --no-save
          node automation/generate_400_excel_report.js "reports/Web-Smoke-Test-Report.xlsx" "Web Smoke Test Suite"

  Upload-Smoke-Report:
    name: Upload Smoke Report
    needs: Generate-Smoke-Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build Excel Artifact
        run: |
          npm install xlsx --no-save
          node automation/generate_400_excel_report.js "reports/Web-Smoke-Test-Report.xlsx" "Web Smoke Test Suite"
      - name: Upload Web Smoke Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Smoke-Test-Report
          path: reports/Web-Smoke-Test-Report.xlsx

  Deploy-To-GitHub-Pages:
    name: Deploy To GitHub Pages
    needs: Upload-Smoke-Report
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Deploy Web Application to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./webpage voting system"
          publish_branch: gh-pages
