<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Election - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-10">
    <header class="bg-[#2C5364] text-white px-6 py-8 shadow-xl">
        <div class="flex items-center space-x-4">
            <a href="../my-elections.html" class="text-white/70 hover:text-white">
                <i class="fas fa-arrow-left text-xl"></i>
            </a>
            <h1 class="text-xl font-bold">Manage Election Schedule</h1>
        </div>
    </header>

    <main class="px-6 mt-12 max-w-md mx-auto">
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-blue-50 text-[#2C5364] rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-inner">
                <i class="fas fa-clock text-4xl"></i>
            </div>
            <h2 id="electionName" class="text-2xl font-extrabold text-gray-800">Election</h2>
            <p class="text-gray-500 mt-2">Set the start and end time in 24-hour format (IST)</p>
        </div>

        <form id="scheduleForm" class="space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100 space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Start Time (24h)</label>
                    <input type="time" id="startTime" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">End Time (24h)</label>
                    <input type="time" id="endTime" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-[#2C5364] outline-none transition-all">
                </div>
            </div>

            <button type="submit" id="saveBtn"
                class="w-full py-5 bg-[#2C5364] text-white rounded-[2rem] font-bold shadow-xl shadow-[#2C5364]/20 hover:bg-[#244452] transition-all flex items-center justify-center space-x-3 transform active:scale-95">
                <span>SAVE SCHEDULE</span>
                <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
            </button>
        </form>
    </main>

    <script src="../api.js"></script>
    <script>
        const token = checkAuth();
        const urlParams = new URLSearchParams(window.location.search);
        const electionId = urlParams.get('id');

        async function init() {
            try {
                const elections = await api.getMyElections(token);
                const el = elections.find(e => e.id === electionId);
                if (el) {
                    document.getElementById('electionName').innerText = el.name;
                    if (el.start_time) document.getElementById('startTime').value = el.start_time;
                    if (el.end_time) document.getElementById('endTime').value = el.end_time;
                }
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const loader = document.getElementById('loader');

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (startTime >= endTime) {
                return alert('End time must be after start time');
            }

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await api.updateElectionSchedule(electionId, startTime, endTime, token);
                if (response.id) {
                    alert('Schedule Updated Successfully!');
                    window.location.href = '../my-elections.html';
                } else {
                    alert('Error: ' + (response.detail || 'Could not save'));
                }
            } catch (err) {
                alert('Network Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });

        init();
    </script>
</body>
</html>
