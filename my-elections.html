<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Elections - Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans pb-24">
    <header class="bg-white px-6 py-8 flex items-center shadow-sm">
        <a href="home.html" class="text-gray-400 hover:text-gray-600 mr-4">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">Elections Created</h1>
    </header>

    <main class="px-6 mt-6 max-w-lg mx-auto">
        <div id="electionsList" class="space-y-4">
            <!-- Loading state -->
            <div class="animate-pulse bg-white p-6 rounded-[2.5rem] border border-gray-100">
                <div class="h-6 w-1/2 bg-gray-100 rounded mb-4"></div>
                <div class="h-4 w-1/3 bg-gray-100 rounded"></div>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-8 py-4 flex justify-between items-center z-50 rounded-t-[2.5rem] shadow-lg">
        <a href="home.html" class="text-gray-300 flex flex-col items-center">
            <i class="fas fa-house text-xl mb-1"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="my-elections.html" class="text-[#2C5364] flex flex-col items-center">
            <i class="fas fa-chart-pie text-xl mb-1"></i>
            <span class="text-[10px] font-bold uppercase">My Polls</span>
        </a>
        <div class="w-12 h-12 bg-[#2C5364] text-white rounded-2xl flex items-center justify-center -mt-12 shadow-lg" onclick="window.location.href='join-election.html'">
            <i class="fas fa-plus"></i>
        </div>
        <a href="joined-elections.html" class="text-gray-300 flex flex-col items-center">
            <i class="fas fa-history text-xl mb-1"></i>
            <span class="text-[10px] font-bold uppercase">History</span>
        </a>
        <a href="profile.html" class="text-gray-300 flex flex-col items-center">
            <i class="fas fa-user text-xl mb-1"></i>
            <span class="text-[10px] font-bold uppercase">Profile</span>
        </a>
    </nav>

    <script src="api.js"></script>
    <script>
        const token = checkAuth();

        async function loadMyElections() {
            try {
                const elections = await api.getMyElections(token);
                const list = document.getElementById('electionsList');
                list.innerHTML = '';

                if (elections.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-20 bg-white rounded-[2.5rem] border border-gray-100">
                            <i class="fas fa-folder-open text-5xl text-gray-100 mb-4"></i>
                            <p class="text-gray-400 font-bold">You haven't created any elections yet.</p>
                            <a href="create-election.html" class="inline-block mt-4 text-[#2C5364] font-bold underline">Create one now</a>
                        </div>
                    `;
                    return;
                }

                elections.forEach(el => {
                    const div = document.createElement('div');
                    div.className = "bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 hover:shadow-md transition-all cursor-pointer relative overflow-hidden group";
                    div.onclick = () => window.location.href = `results.html?id=${el.id}`;
                    div.innerHTML = `
                        <div class="flex items-center justify-between relative z-10">
                            <div>
                                <h3 class="font-extrabold text-gray-800 text-lg group-hover:text-[#2C5364] transition-colors">${el.name}</h3>
                                <div class="flex items-center space-x-4 mt-2">
                                    <div class="flex items-center text-xs font-bold text-gray-400">
                                        <i class="fas fa-calendar-days mr-1.5"></i> ${el.date}
                                    </div>
                                    <div class="flex items-center text-xs font-bold text-gray-400">
                                        <i class="fas fa-hashtag mr-1.5"></i> ${el.election_code}
                                    </div>
                                </div>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="event.stopPropagation(); window.location.href='admin/manage-election.html?id=${el.id}'" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-100 transition-colors" title="Manage Schedule">
                                    <i class="fas fa-clock"></i>
                                </button>
                                <button onclick="event.stopPropagation(); window.location.href='admin/manage-participants.html?id=${el.id}'" class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center hover:bg-amber-100 transition-colors" title="Manage Participants">
                                    <i class="fas fa-users-gear"></i>
                                </button>
                                <div class="w-10 h-10 bg-blue-50 text-[#2C5364] rounded-xl flex items-center justify-center font-black">
                                    <i class="fas fa-chart-simple"></i>
                                </div>
                            </div>
                        </div>
                        <div class="absolute -right-4 -bottom-4 opacity-[0.03] rotate-12 group-hover:scale-110 transition-transform">
                            <i class="fas fa-chart-column text-8xl"></i>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }
        loadMyElections();
    </script>
</body>
</html>
