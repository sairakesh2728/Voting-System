<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #2C5364 0%, #203A43 50%, #0F2027 100%);
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">
    <div class="gradient-bg h-80 w-full flex flex-col items-center justify-center text-white px-4">
        <i class="fas fa-vote-yea text-7xl mb-4 animate-bounce"></i>
        <h1 class="text-5xl font-extrabold tracking-tight">Voting System</h1>
        <p class="mt-3 text-xl text-gray-300">Secure, Transparent & Reliable Elections</p>
    </div>

    <div class="flex-grow flex items-center justify-center px-4 -mt-16">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md transition-transform hover:scale-[1.02]">
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-10">Welcome</h2>

            <div class="space-y-5">
                <a href="login.html" class="flex items-center justify-center w-full py-4 bg-[#2C5364] text-white rounded-2xl font-bold shadow-lg hover:bg-[#244452] transition-all transform active:scale-95">
                    <i class="fas fa-sign-in-alt mr-2"></i> LOG IN
                </a>

                <a href="signup.html" class="flex items-center justify-center w-full py-4 bg-white text-[#2C5364] rounded-2xl font-bold border-2 border-[#2C5364] hover:bg-gray-50 transition-all transform active:scale-95">
                    <i class="fas fa-user-plus mr-2"></i> SIGN UP
                </a>
            </div>

            <div class="mt-12 grid grid-cols-3 gap-4 text-center text-gray-400">
                <div class="flex flex-col items-center">
                    <i class="fas fa-shield-alt text-2xl mb-1 text-[#2C5364]"></i>
                    <span class="text-[10px] font-bold uppercase">Secure</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-bolt text-2xl mb-1 text-[#2C5364]"></i>
                    <span class="text-[10px] font-bold uppercase">Fast</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-check-circle text-2xl mb-1 text-[#2C5364]"></i>
                    <span class="text-[10px] font-bold uppercase">Accurate</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 text-gray-400 text-sm">
        &copy; 2026 Voting System. All rights reserved.
    </footer>

    <script src="api.js"></script>
    <script>
        if (localStorage.getItem('authToken')) {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
